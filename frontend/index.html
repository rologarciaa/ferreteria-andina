<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería Andina</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Ferretería Andina</h1>
        <p>Sistema de gestión de inventario</p>
    </header>

    <main>

        <section class="formulario">
            <h2>Registrar producto</h2>

            <form id="formProducto">

                <input
                    type="text"
                    id="codigo"
                    placeholder="Código del producto"
                    required
                >

                <input
                    type="text"
                    id="nombre"
                    placeholder="Nombre del producto"
                    required
                >

                <input
                    type="text"
                    id="categoria"
                    placeholder="Categoría"
                    required
                >

                <input
                    type="number"
                    id="precio"
                    placeholder="Precio"
                    step="0.01"
                    required
                >

                <input
                    type="number"
                    id="stock"
                    placeholder="Stock"
                    required
                >

                <button type="submit">
                    Registrar producto
                </button>

            </form>
        </section>

        <section class="productos">

            <h2>Productos registrados</h2>

            <table>

                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Producto</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                    </tr>
                </thead>

                <tbody id="tablaProductos">

                </tbody>

            </table>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
